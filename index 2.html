<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJUG databases</title>
    <style>
        :root {
            --bg-main: #0f0f12;
            --bg-sidebar: #16161a;
            --border-color: #2e2e3a;
            --sidebar-width: 200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        body {
            background-color: var(--bg-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
        }

        @keyframes rainbow-move {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .rainbow-text {
            background: linear-gradient(90deg, #ff007f, #ff7f00, #ffea00, #00ff7f, #00e5ff, #7f00ff, #ff007f);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow-move 4s linear infinite;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s ease;
            z-index: 1000;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .sidebar.closed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .sidebar-brand {
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a0a0b0;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .sidebar-link {
            display: block;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }

        .sidebar-link:hover, .sidebar-link.active {
            background-color: var(--border-color);
            border-left-color: #ff007f;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            padding: 25px;
            width: 100%;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .open-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .search-bar {
            flex: 1;
            max-width: 400px;
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            color: #fff;
        }

        .page-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .game-info {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .game-category {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .game-name {
            font-size: 1.15rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .game-description {
            font-size: 0.8rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .download-btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: background-color 0.2s, transform 0.1s;
            border: 1px solid var(--border-color);
            cursor: pointer;
            background-color: #000000;
            color: #ffffff;
        }

        .download-btn:hover {
            background-color: #111115;
            border-color: #444455;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand rainbow-text">PJUG</div>
            <button class="close-btn" id="closeSidebarBtn">&times;</button>
        </div>
        <ul class="sidebar-menu">
            <li><a class="sidebar-link active rainbow-text" onclick="filterCategory('all')">All Files</a></li>
            <li><a class="sidebar-link rainbow-text" onclick="filterCategory('general')">General</a></li>
            <li><a class="sidebar-link rainbow-text" onclick="filterCategory('emulated')">Emulated</a></li>
        </ul>
    </aside>

    <main class="main-content" id="mainContent">
        <header class="navbar">
            <button class="open-btn rainbow-text" id="openSidebarBtn">Menu</button>
            <input type="text" class="search-bar" id="searchField" placeholder="Search the archive..." onkeyup="filterDatabase()">
        </header>

        <section>
            <h2 class="page-title rainbow-text">PJUG databases</h2>
            
            <div class="game-grid" id="gameGrid">
                
                <!-- CARD 1: HTML Games -->
                <div class="game-card" data-category="general">
                    <div class="game-info">
                        <span class="game-category rainbow-text">GAMES</span>
                        <h3 class="game-name rainbow-text">HTML Games</h3>
                        <p class="game-description rainbow-text">All html games in PJUG's database.</p>
                        <div>
                            <a href="games/html-games/game.zip" download="html-games.zip" class="download-btn">Download Folder</a>
                        </div>
                    </div>
                </div>

                <!-- CARD 2: Flash Games -->
                <div class="game-card" data-category="general">
                    <div class="game-info">
                        <span class="game-category rainbow-text">GAMES</span>
                        <h3 class="game-name rainbow-text">Flash Games</h3>
                        <p class="game-description rainbow-text">All flash games in PJUG's database.</p>
                        <div>
                            <a href="games/flash-games/game.zip" download="flash-games.zip" class="download-btn">Download Folder</a>
                        </div>
                    </div>
                </div>

                <!-- CARD 3: Emulated Games -->
                <div class="game-card" data-category="emulated">
                    <div class="game-info">
                        <span class="game-category rainbow-text">GAMES</span>
                        <h3 class="game-name rainbow-text">Emulated Games</h3>
                        <p class="game-description rainbow-text">All emulated and platform games in PJUG's database.</p>
                        <div>
                            <a href="games/emulated-games/game.zip" download="emulated-games.zip" class="download-btn">Download Folder</a>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        // Sidebar Toggles
        const sidebar = document.getElementById('sidebar');
        const openBtn = document.getElementById('openSidebarBtn');
        const closeBtn = document.getElementById('closeSidebarBtn');

        openBtn.addEventListener('click', () => {
            sidebar.classList.remove('closed');
            sidebar.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            sidebar.classList.add('closed');
            sidebar.classList.remove('active');
        });

        // Search Engine Logic
        function filterDatabase() {
            const query = document.getElementById('searchField').value.toLowerCase();
            const cards = document.querySelectorAll('.game-card');

            cards.forEach(card => {
                const title = card.querySelector('.game-name').textContent.toLowerCase();
                const desc = card.querySelector('.game-description').textContent.toLowerCase();
                
                if (title.includes(query) || desc.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Category Filter Logic
        function filterCategory(category) {
            const cards = document.querySelectorAll('.game-card');
            const menuLinks = document.querySelectorAll('.sidebar-link');

            // Handle visual link highlights
            menuLinks.forEach(link => link.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Hide/Show entries based on selection
            cards.forEach(card => {
                const cardCat = card.getAttribute('data-category');
                if (category === 'all' || cardCat === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
