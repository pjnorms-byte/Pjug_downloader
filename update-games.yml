name: Update games list

on:
  push:
    paths:
      - 'games/**'
      - '!games/games.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 make_games.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add games/games.json
          git diff --staged --quiet || (git commit -m "Update games list" && git push)
