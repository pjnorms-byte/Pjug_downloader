<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pjug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141414;--surface:#1d1d1d;--line:#2d2d2d;--text:#ececec;--muted:#8a8a8a;--accent:#ececec;--on-accent:#141414;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="sepia"]{--bg:#f3ead7;--surface:#ebe0c8;--line:#d9ccae;--text:#4a3a2a;--muted:#8d7a62;--accent:#7a4a24;--on-accent:#f3ead7;color-scheme:light}
:root[data-theme="navy"]{--bg:#0b1630;--surface:#11204a;--line:#1d3166;--text:#dfe8ff;--muted:#7f93c4;--accent:#6ea8ff;--on-accent:#0b1630}
:root[data-theme="halloween"]{--bg:#130b0b;--surface:#1f1212;--line:#3a1f14;--text:#f5e8d6;--muted:#a78b6e;--accent:#ff7a1a;--on-accent:#130b0b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  transition:background .25s,color .25s;
}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px}
.mark{font-weight:800;font-size:1.5rem;letter-spacing:-.04em}
.icon-btn{
  background:none;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer;
}
.icon-btn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:12vh 24px 64px}
h1{font-size:clamp(4rem,18vw,11rem);line-height:.9;letter-spacing:-.06em;font-weight:800;margin:0}
.empty{margin-top:28px;color:var(--muted);font-size:1.1rem;max-width:36ch;line-height:1.5}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:48px}

/* settings */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#overlay.open{display:flex}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:24px;
}
.panel h2{margin:0 0 20px;font-size:1.3rem;display:flex;justify-content:space-between;align-items:center}
.panel h3{margin:24px 0 8px;font-size:1rem}
.panel p{margin:0 0 12px;color:var(--muted);font-size:.9rem;line-height:1.45}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.theme{
  display:flex;align-items:center;gap:10px;background:none;color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;text-align:left;
}
.theme[aria-pressed="true"]{border-color:var(--accent);border-width:2px;padding:9px 11px}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);flex:none}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.key{
  display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px 6px 12px;font-size:.9rem
}
.key button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:0 4px}
.key button:hover{color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;
  padding:9px 16px;font:inherit;font-weight:700;cursor:pointer
}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);font-weight:400}
.toggle{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
header,main{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
header{animation:drop .8s cubic-bezier(.2,.8,.2,1) both}
.mark{animation:pulse 4s ease-in-out infinite}
h1{
  background:linear-gradient(90deg,var(--text) 0%,var(--accent) 25%,var(--text) 50%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both,drift 7s ease-in-out 1.1s infinite,shimmer 8s linear infinite;
}
.empty{animation:rise 1s cubic-bezier(.2,.8,.2,1) .35s both}
.icon-btn,.theme,.btn,.key{transition:transform .2s,border-color .2s,background .2s,color .2s}
.icon-btn:hover,.theme:hover,.btn:hover{transform:translateY(-2px)}
.icon-btn:active,.theme:active,.btn:active{transform:scale(.96)}
.key{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
#overlay{position:relative;inset:auto;background:none;display:none;padding:8px 24px 64px;z-index:1;min-height:0}
#overlay.open{display:block}
#overlay .panel{max-width:520px;margin:0 auto;max-height:none;overflow:visible;box-shadow:none}
body.settings-open main{display:none}
#search{display:block;width:100%;max-width:420px;margin-top:32px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 20px;color:var(--text);font:inherit;font-size:1rem;outline:none;transition:border-color .2s,box-shadow .2s;animation:rise 1s cubic-bezier(.2,.8,.2,1) .25s both}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
#search::placeholder{color:var(--muted)}
select{-webkit-appearance:none;appearance:none;background-color:var(--bg);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 32px 9px 12px;font:inherit;width:100%}
.panel:focus{outline:none}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;font:inherit;cursor:pointer;transition:transform .2s,border-color .2s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.cn{font-weight:800;font-size:1.3rem;letter-spacing:-.03em}
.cd{color:var(--muted);font-size:.9rem}
#play{display:none;position:relative;z-index:1;max-width:560px;margin:0 auto;padding:8px 24px 64px}
body.playing #play{display:block}
body.playing main{display:none}
#play .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#play h2{margin:0;font-size:1.4rem;letter-spacing:-.03em}
#game{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none}
.how{color:var(--muted);font-size:.9rem;margin-top:12px}
#frame{display:none;width:100%;height:75vh;border:1px solid var(--line);border-radius:12px;background:#000}
#play.ext{max-width:1100px}
#play.ext #frame{display:block}
#play.ext #game{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:none;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer;transition:transform .2s,background .2s,color .2s,border-color .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}h1{-webkit-text-fill-color:var(--text)}}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<header>
  <span class="mark">pjug</span>
  <button class="icon-btn" id="open-settings" aria-haspopup="dialog">Settings</button>
</header>

<main>
  <h1>pjug</h1>
  <input id="search" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
  <p class="empty" id="empty">No games yet. Check back soon.</p>
  <div id="games"></div>
</main>

<section id="play" aria-label="Game">
  <div class="bar"><h2 id="game-title"></h2><button class="icon-btn" id="back">Back</button></div>
  <canvas id="game" width="480" height="360"></canvas>
  <iframe id="frame" title="Game" allowfullscreen allow="fullscreen; gamepad; autoplay"></iframe>
  <p class="how" id="how"></p>
</section>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="st">
  <div class="panel" tabindex="-1">
    <h2><span id="st">Settings</span><button class="icon-btn" id="close-settings">Close</button></h2>

    <h3>Theme</h3>
    <div class="themes" id="themes"></div>

    <h3>Panic keys</h3>
    <p>Press any of these keys on the site to jump straight to your panic destination in this tab.</p>
    <div class="chips"><button class="chip" id="enabled" aria-pressed="true">Enabled</button></div>
    <div class="keys" id="keys"></div>
    <div class="row">
      <button class="btn" id="add-key">Add key</button>
      <button class="btn ghost" id="reset-keys">Reset</button>
      <button class="btn ghost" id="test">Test</button>
    </div>
    <p id="hint" style="margin-top:12px"></p>

    <h3>Panic destination</h3>
    <div class="chips" id="dest" role="group" aria-label="Panic destination"></div>

    <h3>Tab disguise</h3>
    <p>Changes this tab’s title and icon so it looks like another site.</p>
    <div class="chips" id="cloak" role="group" aria-label="Tab disguise"></div>

    <h3>Dust</h3>
    <div class="chips"><button class="chip" id="dust-toggle" aria-pressed="true">Enabled</button></div>
    <div class="chips" id="density" role="group" aria-label="Dust amount"></div>
  </div>
</div>

<script>
(function(){
  var DESTS={classroom:{url:"https://classroom.google.com"},drive:{url:"https://drive.google.com"},docs:{url:"https://docs.google.com"}};
  var CLOAKS={off:null,classroom:{title:"Classroom",c:"#1e8e3e",l:"C"},drive:{title:"My Drive - Google Drive",c:"#1a73e8",l:"D"},docs:{title:"Untitled document - Google Docs",c:"#4285f4",l:"D"}};
  var THEMES=[
    {id:"dark",name:"Dark",c:"#141414"},
    {id:"sepia",name:"Sepia",c:"#f3ead7"},
    {id:"navy",name:"Navy",c:"#0b1630"},
    {id:"halloween",name:"Halloween",c:"#ff7a1a"}
  ];
  var DEFAULTS={theme:"dark",enabled:true,keys:["`"]};
  var S=load();
  var recording=false;

  function load(){
    try{
      var raw=localStorage.getItem("pjug:settings");
      if(raw){var o=JSON.parse(raw);
        return {
          theme:THEMES.some(function(t){return t.id===o.theme})?o.theme:DEFAULTS.theme,
          enabled:o.enabled!==false,
          keys:Array.isArray(o.keys)&&o.keys.length?o.keys.slice(0,8):DEFAULTS.keys.slice(),
          dest:(o.dest in DESTS)?o.dest:"classroom",
          cloak:(o.cloak in CLOAKS)?o.cloak:"off",
          dust:o.dust!==false,
          density:typeof o.density==="number"?Math.max(0,Math.min(100,o.density)):70
        };}
    }catch(e){}
    return {theme:DEFAULTS.theme,enabled:true,keys:DEFAULTS.keys.slice(),dest:"classroom",cloak:"off",dust:true,density:70};
  }
  function save(){try{localStorage.setItem("pjug:settings",JSON.stringify(S))}catch(e){}}

  var $=function(id){return document.getElementById(id)};
  function label(k){return k===" "?"Space":k.length===1?k.toUpperCase():k}

  function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme)}

  function renderThemes(){
    var box=$("themes");box.innerHTML="";
    THEMES.forEach(function(t){
      var b=document.createElement("button");
      b.className="theme";b.setAttribute("aria-pressed",S.theme===t.id);
      b.innerHTML='<span class="sw" style="background:'+t.c+'"></span>'+t.name;
      b.onclick=function(){S.theme=t.id;save();applyTheme();renderThemes()};
      box.appendChild(b);
    });
  }
  function renderKeys(){
    var box=$("keys");box.innerHTML="";
    S.keys.forEach(function(k,i){
      var s=document.createElement("span");s.className="key";
      s.appendChild(document.createTextNode(label(k)));
      var x=document.createElement("button");x.textContent="\u00d7";x.setAttribute("aria-label","Remove "+label(k));
      x.onclick=function(){S.keys.splice(i,1);save();renderKeys()};
      s.appendChild(x);box.appendChild(s);
    });
    if(!S.keys.length){box.textContent="No keys set.";box.style.color="var(--muted)"}else{box.style.color=""}
    $("enabled").setAttribute("aria-pressed",String(S.enabled));
  }
  function panic(){window.location.replace(DESTS[S.dest].url)}

  function open(){stopPlay();document.body.classList.add("settings-open");window.scrollTo(0,0);$("overlay").classList.add("open");renderThemes();renderKeys();renderMisc();$("overlay").querySelector(".panel").focus({preventScroll:true})}
  function close(){document.body.classList.remove("settings-open");$("overlay").classList.remove("open");stopRec()}
  function stopRec(){recording=false;$("hint").textContent="";$("add-key").textContent="Add key"}

  $("open-settings").onclick=open;
  $("close-settings").onclick=close;
  $("overlay").addEventListener("mousedown",function(e){if(e.target===this)close()});
  $("enabled").onclick=function(){S.enabled=!S.enabled;save();this.setAttribute("aria-pressed",String(S.enabled))};
  $("add-key").onclick=function(){
    if(recording){stopRec();return}
    recording=true;$("add-key").textContent="Cancel";$("hint").textContent="Press the key you want to use\u2026";
  };
  $("reset-keys").onclick=function(){S.keys=DEFAULTS.keys.slice();S.enabled=true;save();renderKeys()};
  $("test").onclick=panic;

  var DEST_OPTS=[["classroom","Classroom"],["drive","Drive"],["docs","Docs"]];
  var CLOAK_OPTS=[["off","Off"],["classroom","Classroom"],["drive","Drive"],["docs","Docs"]];
  var DENS_OPTS=[[20,"Low"],[45,"Medium"],[70,"High"],[100,"Lots"]];
  function chips(id,opts,cur,set){
    var box=$(id);box.innerHTML="";
    opts.forEach(function(o){
      var b=document.createElement("button");b.className="chip";b.textContent=o[1];
      b.setAttribute("aria-pressed",String(cur()===o[0]));
      b.onclick=function(){set(o[0]);save();renderMisc()};
      box.appendChild(b);
    });
  }
  function renderMisc(){
    chips("dest",DEST_OPTS,function(){return S.dest},function(v){S.dest=v});
    chips("cloak",CLOAK_OPTS,function(){return S.cloak},function(v){S.cloak=v;applyCloak()});
    chips("density",DENS_OPTS,function(){return S.density},function(v){S.density=v;window.dispatchEvent(new Event("resize"))});
    $("dust-toggle").setAttribute("aria-pressed",String(S.dust));
  }
  function applyCloak(){
    var c=CLOAKS[S.cloak],l=document.querySelector('link[rel="icon"]');
    if(!l){l=document.createElement("link");l.rel="icon";document.head.appendChild(l)}
    var fill=c?c.c:"#141414",ch=c?c.l:"p";
    document.title=c?c.title:"pjug";
    l.href="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="'+fill+'"/><text x="16" y="23" font-size="20" font-family="Arial" font-weight="700" text-anchor="middle" fill="#fff">'+ch+'</text></svg>');
  }
  $("dust-toggle").onclick=function(){S.dust=!S.dust;save();renderMisc()};
  $("search").addEventListener("input",renderGames);
  document.addEventListener("keydown",function(e){
    var t=e.target&&e.target.tagName;
    if(e.key==="/"&&!recording&&S.keys.indexOf("/")<0&&t!=="INPUT"&&t!=="SELECT"&&!$("overlay").classList.contains("open")){e.preventDefault();$("search").focus()}
  });
  applyCloak();

  document.addEventListener("keydown",function(e){
    if(recording){
      e.preventDefault();
      if(["Shift","Control","Alt","Meta"].indexOf(e.key)>-1)return;
      var k=e.key.length===1?e.key.toLowerCase():e.key;
      if(S.keys.indexOf(k)<0&&S.keys.length<8){S.keys.push(k);save();renderKeys()}
      stopRec();return;
    }
    if(e.key==="Escape"&&$("overlay").classList.contains("open")){close();return}
    if(!S.enabled||e.ctrlKey||e.metaKey||e.altKey)return;
    var t=e.target&&e.target.tagName;
    if(t==="INPUT"||t==="TEXTAREA")return;
    var k2=e.key.length===1?e.key.toLowerCase():e.key;
    if(S.keys.indexOf(k2)>-1){e.preventDefault();panic()}
  });

  /* games */
  var GAMES=[
    {id:'snake',name:'Snake',desc:'Eat, grow, don\u2019t crash.',how:'Arrow keys or WASD. Swipe on touch.',make:snake},
    {id:'pong',name:'Pong',desc:'First to 7 beats the bot.',how:'Mouse, touch, or W/S and arrow keys.',make:pong},
    {id:'breakout',name:'Breakout',desc:'Clear every brick.',how:'Mouse, touch, or A/D and arrow keys.',make:breakout}
  ];
  var cv=$('game'),c2=cv.getContext('2d'),raf=0,cur=null,curGame=null,keys={},ptr={x:null,y:null},sw=null,sd=null;
  function colors(){var s=getComputedStyle(document.documentElement),g=function(n){return s.getPropertyValue(n).trim()};return{bg:g('--bg'),surface:g('--surface'),line:g('--line'),text:g('--text'),muted:g('--muted'),accent:g('--accent')}}
  function renderGames(){
    var q=$('search').value.trim().toLowerCase(),box=$('games');box.innerHTML='';
    var list=GAMES.filter(function(g){return !q||g.name.toLowerCase().indexOf(q)>-1});
    list.forEach(function(g){
      var b=document.createElement('button');b.className='card';
      b.innerHTML='<span class="cn"></span><span class="cd"></span>';
      b.firstChild.textContent=g.name;b.lastChild.textContent=g.desc;
      b.onclick=function(){play(g)};box.appendChild(b);
    });
    $('empty').style.display=list.length?'none':'';
    $('empty').textContent=GAMES.length?'No games match that.':'No games yet. Check back soon.';
  }
  function stopPlay(){cancelAnimationFrame(raf);curGame=null;$('frame').removeAttribute('src');$('play').classList.remove('ext');document.body.classList.remove('playing')}
  function play(g){
    cancelAnimationFrame(raf);cur=g;
    document.body.classList.add('playing');window.scrollTo(0,0);
    $('game-title').textContent=g.name;$('how').textContent=g.how;
    $('play').classList.toggle('ext',!!g.ext);
    if(g.ext){curGame=null;$('frame').src=g.ext;$('how').textContent=g.desc||'';return}
    var W=480,H=360,C=colors(),acc=0,last=0;ptr.x=ptr.y=null;sw=null;
    var game=g.make({W:W,H:H,keys:keys,ptr:ptr,swipe:function(){var s=sw;sw=null;return s}});
    curGame=game;cv.width=W;cv.height=H;
    function loop(t){
      raf=requestAnimationFrame(loop);
      if(!last)last=t;
      acc+=Math.min(100,t-last);last=t;
      while(acc>=16.67){acc-=16.67;if(!game.over)game.step()}
      c2.fillStyle=C.surface;c2.fillRect(0,0,W,H);
      game.draw(c2,C);
      c2.textBaseline='top';c2.textAlign='left';c2.font='700 16px Bricolage Grotesque,system-ui,sans-serif';
      c2.fillStyle=C.muted;c2.fillText(String(game.score),12,10);
      if(game.over){
        c2.globalAlpha=.75;c2.fillStyle=C.bg;c2.fillRect(0,0,W,H);c2.globalAlpha=1;
        c2.textAlign='center';c2.fillStyle=C.text;c2.font='800 32px Bricolage Grotesque,system-ui,sans-serif';
        c2.fillText(game.msg||'Game over',W/2,H/2-30);
        c2.font='400 16px Bricolage Grotesque,system-ui,sans-serif';c2.fillStyle=C.muted;
        c2.fillText('Press Space or tap to play again',W/2,H/2+14);
      }
    }
    raf=requestAnimationFrame(loop);
  }
  function snake(e){
    var N=20,cols=e.W/N,rows=e.H/N,s=[{x:8,y:9},{x:7,y:9},{x:6,y:9}],d={x:1,y:0},nd=d,f=put(),t=0,sc=0,self={score:'Score 0'};
    function put(){var p;do{p={x:Math.random()*cols|0,y:Math.random()*rows|0}}while(s.some(function(a){return a.x===p.x&&a.y===p.y}));return p}
    self.step=function(){
      var k=e.keys,n=null;
      if(k.ArrowUp||k.w)n={x:0,y:-1};else if(k.ArrowDown||k.s)n={x:0,y:1};else if(k.ArrowLeft||k.a)n={x:-1,y:0};else if(k.ArrowRight||k.d)n={x:1,y:0};
      var v=e.swipe();if(v)n=v;
      if(n&&(n.x!==-d.x||n.y!==-d.y))nd=n;
      if(++t<7)return;t=0;d=nd;
      var h={x:s[0].x+d.x,y:s[0].y+d.y};
      if(h.x<0||h.y<0||h.x>=cols||h.y>=rows||s.some(function(a){return a.x===h.x&&a.y===h.y})){self.over=true;return}
      s.unshift(h);
      if(h.x===f.x&&h.y===f.y){sc++;f=put();self.score='Score '+sc}else s.pop();
    };
    self.draw=function(c,C){
      c.fillStyle=C.accent;c.beginPath();c.arc(f.x*N+N/2,f.y*N+N/2,N/2-3,0,6.283);c.fill();
      c.fillStyle=C.text;
      s.forEach(function(a,i){c.globalAlpha=i?.75:1;c.fillRect(a.x*N+1,a.y*N+1,N-2,N-2)});
      c.globalAlpha=1;
    };
    return self;
  }
  function pong(e){
    var W=e.W,H=e.H,p=H/2-30,a=H/2-30,b={x:W/2,y:H/2,vx:4,vy:2.5},ps=0,as=0,self={score:'0 : 0'};
    function reset(dir){b.x=W/2;b.y=H/2;b.vx=4*dir;b.vy=Math.random()*4-2}
    self.step=function(){
      var up=e.keys.ArrowUp||e.keys.w,dn=e.keys.ArrowDown||e.keys.s;
      if(up||dn){e.ptr.y=null;p+=(dn?6:0)-(up?6:0)}else if(e.ptr.y!=null)p=e.ptr.y-30;
      p=Math.max(0,Math.min(H-60,p));
      a+=Math.max(-3.4,Math.min(3.4,b.y-(a+30)));a=Math.max(0,Math.min(H-60,a));
      b.x+=b.vx;b.y+=b.vy;
      if(b.y<6||b.y>H-6)b.vy*=-1;
      if(b.vx<0&&b.x<24&&b.x>10&&b.y>p&&b.y<p+60){b.vx=Math.min(9,Math.abs(b.vx)*1.06);b.vy+=(b.y-p-30)/10}
      if(b.vx>0&&b.x>W-24&&b.x<W-10&&b.y>a&&b.y<a+60){b.vx=-Math.min(9,Math.abs(b.vx)*1.06)}
      if(b.x<0){as++;reset(1)}
      if(b.x>W){ps++;reset(-1)}
      self.score=ps+' : '+as;
      if(ps>=7||as>=7){self.over=true;self.msg=ps>=7?'You win':'Bot wins'}
    };
    self.draw=function(c,C){
      c.fillStyle=C.line;for(var y=0;y<H;y+=24)c.fillRect(W/2-1,y,2,12);
      c.fillStyle=C.text;c.fillRect(10,p,8,60);c.fillRect(W-18,a,8,60);
      c.fillStyle=C.accent;c.beginPath();c.arc(b.x,b.y,6,0,6.283);c.fill();
    };
    return self;
  }
  function breakout(e){
    var W=e.W,H=e.H,pw=70,px=W/2-35,rows=5,cols=8,bw=W/cols,bh=18,br=[],lives=3,sc=0,b={x:W/2,y:H-40,vx:3,vy:-3.2},self={score:'Score 0   Lives 3'};
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)br.push({x:c*bw,y:40+r*bh,on:true});
    self.step=function(){
      var l=e.keys.ArrowLeft||e.keys.a,rt=e.keys.ArrowRight||e.keys.d;
      if(l||rt){e.ptr.x=null;px+=(rt?6:0)-(l?6:0)}else if(e.ptr.x!=null)px=e.ptr.x-pw/2;
      px=Math.max(0,Math.min(W-pw,px));
      b.x+=b.vx;b.y+=b.vy;
      if(b.x<5||b.x>W-5)b.vx*=-1;
      if(b.y<5)b.vy*=-1;
      if(b.vy>0&&b.y>H-24&&b.y<H-12&&b.x>px&&b.x<px+pw){b.vy=-Math.abs(b.vy);b.vx=(b.x-px-pw/2)/10}
      if(b.y>H){lives--;b.x=W/2;b.y=H-40;b.vx=3;b.vy=-3.2;if(lives<=0){self.over=true;self.msg='Out of lives'}}
      for(var i=0;i<br.length;i++){var k=br[i];if(k.on&&b.x>k.x&&b.x<k.x+bw&&b.y>k.y&&b.y<k.y+bh){k.on=false;b.vy*=-1;sc++;break}}
      if(br.every(function(k){return !k.on})){self.over=true;self.msg='Cleared'}
      self.score='Score '+sc+'   Lives '+lives;
    };
    self.draw=function(c,C){
      br.forEach(function(k){if(!k.on)return;c.globalAlpha=1-(k.y-40)/bh/rows*.6;c.fillStyle=C.accent;c.fillRect(k.x+2,k.y+2,bw-4,bh-4)});
      c.globalAlpha=1;
      c.fillStyle=C.text;c.fillRect(px,H-20,pw,8);
      c.fillStyle=C.accent;c.beginPath();c.arc(b.x,b.y,5,0,6.283);c.fill();
    };
    return self;
  }
  function cp(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*480/r.width,y:(e.clientY-r.top)*360/r.height}}
  cv.addEventListener('pointermove',function(e){
    var p=cp(e);ptr.x=p.x;ptr.y=p.y;
    if(sd){var dx=e.clientX-sd.x,dy=e.clientY-sd.y;
      if(Math.abs(dx)>24||Math.abs(dy)>24){sw=Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1};sd={x:e.clientX,y:e.clientY}}}
  });
  cv.addEventListener('pointerdown',function(e){sd={x:e.clientX,y:e.clientY};if(curGame&&curGame.over)play(cur)});
  window.addEventListener('pointerup',function(){sd=null});
  $('back').onclick=stopPlay;
  document.addEventListener('keydown',function(e){
    if(!document.body.classList.contains('playing'))return;
    var k=e.key.length===1?e.key.toLowerCase():e.key;
    if(k===' '||k.indexOf('Arrow')===0)e.preventDefault();
    keys[k]=true;
    if((k===' '||k==='Enter')&&curGame&&curGame.over)play(cur);
    if(k==='Escape')stopPlay();
  });
  document.addEventListener('keyup',function(e){keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
  window.addEventListener('blur',function(){for(var k in keys)keys[k]=false});
  fetch('games/games.json').then(function(r){return r.ok?r.json():[]}).then(function(list){
    if(!Array.isArray(list))return;
    list.forEach(function(x){if(x&&x.name&&x.path)GAMES.push({id:x.path,name:String(x.name),desc:String(x.desc||''),how:'',ext:'games/'+x.path})});
    renderGames();
  }).catch(function(){});
  $('frame').addEventListener('load',function(){
    try{
      var fw=this.contentWindow;
      ['keydown','keyup'].forEach(function(t){
        fw.addEventListener(t,function(e){document.dispatchEvent(new KeyboardEvent(t,{key:e.key,ctrlKey:e.ctrlKey,metaKey:e.metaKey,altKey:e.altKey}))});
      });
    }catch(err){}
  });
  renderGames();

  /* dust */
  (function(){
    var c=$("dust"),x=c.getContext("2d"),W=0,H=0,P=[],B=[],cx=-999,cy=-999,mx=0,my=0,col="255,255,255",dpr=Math.min(window.devicePixelRatio||1,2);
    var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
    function setCol(){
      var h=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      var m=/^#([0-9a-f]{6})$/i.exec(h);
      if(m){var n=parseInt(m[1],16);col=(n>>16&255)+","+(n>>8&255)+","+(n&255)}
    }
    function make(){return {x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*2,d:.3+Math.random()*.7,vx:(Math.random()-.5)*.25,vy:-.08-Math.random()*.25,a:Math.random()*6.28,s:.01+Math.random()*.03}}
    function size(){
      W=window.innerWidth;H=window.innerHeight;
      c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
      var n=Math.min(160,Math.round(W*H/9000*S.density/100));
      while(P.length<n)P.push(make());
      P.length=n;
    }
    function draw(){
      x.clearRect(0,0,W,H);
      if(!S.dust){if(!reduce)requestAnimationFrame(draw);return}
      for(var i=0;i<P.length;i++){
        var p=P[i];
        if(!reduce){
          var dx=p.x-cx,dy=p.y-cy,q=dx*dx+dy*dy;
          if(q<22500&&q>1){var f=(1-q/22500)*2.2*p.d,l=Math.sqrt(q);p.x+=dx/l*f;p.y+=dy/l*f}
          p.x+=p.vx+Math.sin(p.a)*.15;p.y+=p.vy;p.a+=p.s;
          if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
          if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
        }
        var al=(.12+.4*(Math.sin(p.a*2)*.5+.5))*p.d;
        x.beginPath();
        x.arc(p.x+mx*p.d*30,p.y+my*p.d*30,p.r*p.d+.3,0,6.283);
        x.fillStyle="rgba("+col+","+al+")";
        x.fill();
      }
      for(var j=B.length-1;j>=0;j--){
        var b=B[j];b.x+=b.vx;b.y+=b.vy;b.vx*=.95;b.vy*=.95;b.l-=.025;
        if(b.l<=0){B.splice(j,1);continue}
        x.beginPath();x.arc(b.x,b.y,b.r,0,6.283);x.fillStyle="rgba("+col+","+(b.l*.7)+")";x.fill();
      }
      if(!reduce)requestAnimationFrame(draw);
    }
    window.addEventListener("resize",size);
    window.addEventListener("pointermove",function(e){mx=e.clientX/W-.5;my=e.clientY/H-.5;cx=e.clientX;cy=e.clientY});
    window.addEventListener("pointerdown",function(e){
      if(!S.dust||reduce)return;
      for(var k=0;k<18;k++){var a=Math.random()*6.283,s=1.5+Math.random()*4;B.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:.8+Math.random()*1.8,l:1})}
    });
    new MutationObserver(setCol).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
    setCol();size();draw();
  })();

  applyTheme();
})();
</script>
